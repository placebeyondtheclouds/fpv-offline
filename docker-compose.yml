name: "fpv-offline"

services:
  # menu at http://localhost:81/
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.8.0
    container_name: homepage
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
      HOMEPAGE_ALLOWED_HOSTS: localhost:81
      HOMEPAGE_VAR_BETAFLIGHT_VERSION: ${BETAFLIGHT_VERSION}
      HOMEPAGE_VAR_BETAFLIGHT_CONF_VERSION: ${BETAFLIGHT_CONF_VERSION}
      HOMEPAGE_VAR_BETAFLIGHT_FW_TARGET: ${BETAFLIGHT_FW_TARGET}
      HOMEPAGE_VAR_BLUEJAY_TARGET: ${BLUEJAY_TARGET}
      HOMEPAGE_VAR_BLUEJAY_PWM: ${BLUEJAY_PWM}
      HOMEPAGE_VAR_BLUEJAY_VERSION: ${BLUEJAY_VERSION}
      HOMEPAGE_VAR_HOST_IP: ${HOST_IP}
    ports:
      - 81:3000
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - homepage_data:/app/config:rw
    restart: unless-stopped
    depends_on:
      copier:
        condition: service_completed_successfully

  # updates scripts on containers volumes for Betaflight firmware, Bluejay firmware and the Homepage
  copier:
    image: alpine:3.23.3
    entrypoint: /bin/sh
    command: -c " cp -r /local/homepage/config/* /app/config/  && cp /local/fw.sh /betaflight/fw.sh && cp /local/bluejay.sh /bluejay/bluejay.sh"
    container_name: copier
    restart: no
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - homepage_data:/app/config:rw
      - .:/local:ro
      - betaflight-fw_data:/betaflight:rw
      - bluejay_data:/bluejay:rw
  # builds fw and quits
  betaflight-fw:
    build:
      context: .
      dockerfile: Dockerfile-betaflight-fw
      args:
        COUNTRY: ${COUNTRY}
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
      BETAFLIGHT_BRANCH: ${BETAFLIGHT_BRANCH}
      BETAFLIGHT_VERSION: ${BETAFLIGHT_VERSION}
      BETAFLIGHT_FW_TARGET: ${BETAFLIGHT_FW_TARGET}
      BETAFLIGHT_FW_EXTRA_FLAGS: ${BETAFLIGHT_FW_EXTRA_FLAGS}
      ARM_SDK_DIR: "/usr/"
    container_name: betaflight-fw
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - betaflight-fw_data:/opt:rw
      - ./fw:/fw:rw
    restart: no
    command: bash -c "chmod u+x fw.sh && ./fw.sh"
    depends_on:
      copier:
        condition: service_completed_successfully

  # builds fw and quits
  bluejay:
    build:
      context: .
      dockerfile: Dockerfile-bluejay
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
      BLUEJAY_TARGET: ${BLUEJAY_TARGET}
      BLUEJAY_PWM: ${BLUEJAY_PWM}
      BLUEJAY_VERSION: ${BLUEJAY_VERSION}
    container_name: bluejay
    entrypoint: /bin/sh
    command: -c "cd /opt && chmod u+x ./bluejay.sh && ./bluejay.sh"
    restart: no
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - bluejay_data:/opt:rw
      - ./fw:/fw:rw
    depends_on:
      copier:
        condition: service_completed_successfully

  configurator-betaflight:
    build:
      context: .
      dockerfile: Dockerfile-configurator-bf
      args:
        COUNTRY: ${COUNTRY}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        ALL_PROXY: ${ALL_PROXY}
        BETAFLIGHT_CONF_VERSION: ${BETAFLIGHT_CONF_VERSION}
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
    container_name: configurator-betaflight
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - configurator-betaflight_data:/opt:rw
    restart: unless-stopped
    ports:
      - 82:8080
    command: "yarn preview --host 0.0.0.0"

  configurator-betaflight-master:
    build:
      context: .
      dockerfile: Dockerfile-configurator-bf-master
      args:
        COUNTRY: ${COUNTRY}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        ALL_PROXY: ${ALL_PROXY}
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
    container_name: configurator-betaflight-master
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - configurator-betaflight-master_data:/opt:rw
    restart: unless-stopped
    ports:
      - 88:8080
    command: "yarn preview --host 0.0.0.0"

  configurator-am32-master:
    build:
      context: .
      dockerfile: Dockerfile-configurator-am32-master
      args:
        COUNTRY: ${COUNTRY}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        ALL_PROXY: ${ALL_PROXY}
        NODE_VERSION: 24
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
      DATABASE_URL: mysql://am32:am32@127.0.0.1:3306/am32
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    container_name: configurator-am32-master
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - configurator-am32-master_data:/opt:rw
    restart: unless-stopped
    ports:
      - 89:3000
    command: "node .output/server/index.mjs"

  bb:
    build:
      context: .
      dockerfile: Dockerfile-bb
      args:
        COUNTRY: ${COUNTRY}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        ALL_PROXY: ${ALL_PROXY}
        BETAFLIGHT_VERSION: ${BETAFLIGHT_VERSION}
        BB_VER: ${BB_VER}
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
    container_name: bb
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - bb_data:/opt:rw
    restart: unless-stopped
    ports:
      - 85:4173
    command: "yarn preview --host 0.0.0.0"

  configurator-esc:
    build:
      context: .
      dockerfile: Dockerfile-configurator-esc
      args:
        COUNTRY: ${COUNTRY}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        ALL_PROXY: ${ALL_PROXY}
        NODE_VERSION: 16.16.0
        ESC_CONF_VER: ${ESC_CONF_VER}
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
    container_name: configurator-esc
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - configurator-esc_data:/opt:rw
    restart: unless-stopped
    ports:
      - 83:3000
    command: "yarn start --host 0.0.0.0"

  elrs-webflasher:
    build:
      context: .
      dockerfile: Dockerfile-elrs-webflasher
      args:
        COUNTRY: ${COUNTRY}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        ALL_PROXY: ${ALL_PROXY}
        NODE_VERSION: 25.3.0
        ELRS_FLASHER_VER: ${ELRS_FLASHER_VER}
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
    container_name: elrs-webflasher
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    ports:
      - 84:8080
    command: "npm run dev -- --host 0.0.0.0"

  # bucksaw:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile-bucksaw
  #     args:
  #       COUNTRY: ${COUNTRY}
  #       HTTP_PROXY: ${HTTP_PROXY}
  #       HTTPS_PROXY: ${HTTPS_PROXY}
  #       ALL_PROXY: ${ALL_PROXY}
  #       BUCKSAW_REF: ${BUCKSAW_REF}
  #   environment:
  #     HTTP_PROXY: ${HTTP_PROXY}
  #     HTTPS_PROXY: ${HTTPS_PROXY}
  #     ALL_PROXY: ${ALL_PROXY}
  #   container_name: bucksaw
  #   volumes:
  #     - /etc/localtime:/etc/localtime:ro
  #   restart: unless-stopped
  #   ports:
  #     - 90:80

  nginx:
    build:
      context: .
      dockerfile: Dockerfile-nginx
    container_name: nginx
    ports:
      - "86:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./fw:/usr/share/nginx/html/fw:ro
      - ./elrs-firmware-src/MurmurLRS/src/.pio/build:/usr/share/nginx/html/murmurlrs-build:ro
    restart: unless-stopped

  elrs-conf:
    build:
      context: .
      target: elrs-desktop
      dockerfile: Dockerfile-elrs-conf
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        ALL_PROXY: ${ALL_PROXY}
        ELRS_CFG_SRC_REPOSITORY: ${ELRS_CFG_SRC_REPOSITORY}
        ELRS_CFG_REF: ${ELRS_CFG_REF:-master}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    environment:
      HTTP_PROXY: ${HTTP_PROXY}
      HTTPS_PROXY: ${HTTPS_PROXY}
      ALL_PROXY: ${ALL_PROXY}
      VNC_PASSWORD: ${VNC_PASSWORD}
      SCREEN_WIDTH: ${SCREEN_WIDTH:-1600}
      SCREEN_HEIGHT: ${SCREEN_HEIGHT:-900}
      SCREEN_DEPTH: ${SCREEN_DEPTH:-24}
      DISPLAY: ":0"
    volumes:
      - ${ELRS_FIRMWARE_SOURCE_DIR}:/firmware:rw
      - elrs-conf-home:/home/elrs
    shm_size: 1gb
    networks:
      - guac-internal
    expose:
      - "5900"
    healthcheck:
      test:
        - CMD-SHELL
        - 'xdpyinfo -display "$${DISPLAY:-:0}" >/dev/null 2>&1 && pgrep -x x11vnc >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      guacamole:
        condition: service_started

  guac-db:
    build:
      context: .
      target: guac-db
      dockerfile: Dockerfile-elrs-conf
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${GUAC_DB_PASSWORD}
      GUAC_VNC_PASSWORD: ${VNC_PASSWORD}
    volumes:
      - guac-db:/var/lib/postgresql/data
    networks:
      - guac-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guacamole_user -d guacamole_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    networks:
      - guac-internal

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      guac-db:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: guac-db
      POSTGRESQL_DATABASE: guacamole_db
      POSTGRESQL_USERNAME: guacamole_user
      POSTGRESQL_PASSWORD: ${GUAC_DB_PASSWORD}
      WEBAPP_CONTEXT: ROOT
    ports:
      - "${GUACAMOLE_PORT}:8080"
    networks:
      - guac-internal

volumes:
  homepage_data:
    driver: local
  betaflight-fw_data:
    driver: local
  configurator-betaflight_data:
    driver: local
  configurator-betaflight-master_data:
    driver: local
  configurator-am32-master_data:
    driver: local
  configurator-esc_data:
    driver: local
  configurator-elrs_data:
    driver: local
  bluejay_data:
    driver: local
  bb_data:
    driver: local
  elrs-conf-home:
    driver: local
  guac-db:
    driver: local

networks:
  guac-internal:
    driver: bridge
